[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudo-studio"
version = "0.1.0"
description = "Local pseudocode compiler studio with Python and JavaScript targets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.100,<7",
  "pip-audit>=2.9,<3",
  "pre-commit>=4,<5",
  "pytest>=9.0,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra --cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
